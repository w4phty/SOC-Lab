title: Discovery - Windows account enumeration
id: 96d0a298-2714-4842-95a5-db4b7eaaca78
x_rule_id: SPL-18
status: experimental
description: |
  Detects common enumeration methods. Based on Sysmon field command_line.
references:
  - https://attack.mitre.org/techniques/T1087/
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    command_line|contains:
      - 'net  user'
      - 'net  localgroup administrators'
      - 'net  group \"domain admins\"'
      - 'whoami  /groups'
      - 'Get-ADUser'
      - 'Get-LocalUser'
  condition: selection
falsepositives:
  - Legitimate audit IT scripts
level: low
tags:
  - attack.discovery
  - attack.t1087
