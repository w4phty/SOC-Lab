title: Execution - Powershell encoded commands or downloads
id: 5710827d-9730-451b-8832-c19ef151a2bb
x_rule_id: SPL-04
status: experimental
description: |
  Detects encoded powershell commands, memory execution or download commands. Based on
  Sysmon fields command_line and executable.
references:
  - https://attack.mitre.org/techniques/T1059/001/
logsource:
  product: windows
  service: process_creation
detection:
  selection_exe:
    executable|endswith: '\powershell.exe'
  selection_cmd:
    command_line|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
      - 'FromBase64String'
      - 'DownloadString'
      - 'IEX('
      - 'Invoke-Expression'
      - '-WindowStyle Hidden'
      - '-nop'
  condition: selection_exe and selection_cmd
falsepositives:
  - Legitimate admin scripts using encoded powershell commands.
level: high
tags:
  - attack.execution
  - attack.t1059.001
