title: Lateral Movement - Alternative authentication indicators
id: e079b92e-8797-49d2-aa94-8b24935fce88
x_rule_id: SPL-22
status: experimental
description: |
  Detects alternative authentication methods such as pass-the-hash or overpass-the-ticket.
  Based on Sysmon field command_line.
references:
  - https://attack.mitre.org/techniques/T1550/
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    command_line|contains:
      - 'sekurlsa::pth'
      - 'over-pass-the-hash'
      - '/ptt'
  condition: selection
falsepositives:
  - legitimate testing
level: high
tags:
  - attack.lateral_movement
  - attack.t1550
