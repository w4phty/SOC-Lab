title: Execution - Windows Command Shell
id: ba2b0f31-3eff-461b-a537-8a0e070ce817
x_rule_id: SPL-05
status: experimental
description: |
  Detects cmd.exe launched with post initial access enumeration commands. Based on
  Sysmon fields executable and command_line.
references:
  - https://attack.mitre.org/techniques/T1059/003/
logsource:
  product: windows
  service: process_creation
detection:
  selection_exe:
    executable|endswith: '\cmd.exe'
  selection_cmd:
    command_line|contains:
      - 'whoami /all'
      - 'net user /domain'
      - 'net group "domain admins"'
      - 'systeminfo'
      - 'tasklist /v'
      - '& echo'
      - '/c powershell'
  condition: selection_exe and selection_cmd
falsepositives:
  - IT legitimate inventory commands
level: medium
tags:
  - attack.execution
  - attack.t1059.003
