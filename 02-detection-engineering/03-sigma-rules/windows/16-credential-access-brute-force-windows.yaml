title: Credential Access - Windows account bruteforce
id: e518646b-495a-457f-8fa9-1fbb5bf76f2c
x_rule_id: SPL-16
status: experimental
description: |
  Detects high number of failed login attempts (EventID 4625). Based on 
  WinEventLog:Security field event_code and hostname.
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: windows
  service: security
detection:
  selection:
    event_code: 4625
  timeframe: 5m
  condition: selection | count() by hostname > 10
falsepositives:
  - services or scripts using expired credentials, or user having forgotten their credentials
level: high
tags:
  - attack.credential_access
  - attack.t1110
