title: User Execution - Suspicious process chain
id: 39fba7a7-0b5c-4cb2-9b64-6e6e8289efe6
x_rule_id: SPL-08
status: experimental
description: |
  Detects an unusual child process launched by a software to open a malicious file, link
  or image.
references:
  - https://attack.mitre.org/techniques/T1204/
logsource:
  product: windows
  service: process_creation
detection:
  selection_parent:
    parent_executable|endswith:
      - '\outlook.exe'
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\acrord32.exe'
  selection_child:
    executable|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate macro lauching known script
level: high
tags:
  - attack.execution
  - attack.t1204
