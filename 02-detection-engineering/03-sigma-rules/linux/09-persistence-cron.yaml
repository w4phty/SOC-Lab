title: Persistence - Suspicious cron modification
id: 3a7a1520-c76a-4d8d-a73e-6dc75298e7c5
x_rule_id: SPL-09
status: experimental
description: |
  Detects any new cron job via crontab or cron files edition. Based on auditd
  fields name and command_line.
references:
  - https://attack.mitre.org/techniques/T1053/003/
logsource:
  product: linux
  service: auditd
detection:
  selection_cmd:
    command_line|contains:
      - 'crontab -e'
      - 'crontab -l'
      - '>> /etc/crontab'
      - '/etc/cron.d/'
      - 'crontab'
  selection_file:
    command_line|contains:
      - '/etc/cron.d/'
      - '/var/spool/cron/'
  condition: selection_cmd or selection_file
falsepositives:
  - Legitimate admin planned cron jobs
level: medium
tags:
  - attack.persistence
  - attack.t1053.003
