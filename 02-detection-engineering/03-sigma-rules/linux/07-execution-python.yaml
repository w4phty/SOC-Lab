title: Execution - Backdoor or reverse shell
id: d61b394c-7428-467d-95f7-a944eee888ef
x_rule_id: SPL-07
status: experimental
description: |
  Detects python or python3 execution, with suspicious command line that could 
  be a network backdoor (import socket/subprocess, connect()). Based on auditd logs, 
  using fields command_line and executable.
references:
  - https://attack.mitre.org/techniques/T1059/006/
logsource:
  product: linux
  service: auditd
detection:
  selection_exe:
    command_line|contains:
      - '/python3'
      - '/python'
  selection_cmd:
    command_line|contains:
      - 'import socket'
      - 'import subprocess'
      - 'subprocess.Popen'
      - 'connect('
  condition: selection_exe and selection_cmd
falsepositives:
  - Legitimate admin scripts using python socket/subprocess
level: high
tags:
  - attack.execution
  - attack.t1059.006
