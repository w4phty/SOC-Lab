title: Privilege Escalation - setuid/setgid
id: 0fae9ca7-b70b-403d-983e-d59b001818c8
x_rule_id: SPL-13
status: experimental
description: |
  Detects the addition of setuid/setgid bit on a binary with chmod, 
  and the search for existing SUID binaries. Based on auditd field 
  command_line.
references:
  - https://attack.mitre.org/techniques/T1548/001/
logsource:
  product: linux
  service: auditd
detection:
  selection:
    command_line|contains:
      - 'chmod +s'
      - 'chmod u+s'
      - 'chmod 4755'
      - 'chmod 2755'
      - 'find / -perm -4000'
      - 'find / -perm -u=s'
  condition: selection
falsepositives:
  - Legitimate setuid binaries installation (ping or sudo)
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.001
