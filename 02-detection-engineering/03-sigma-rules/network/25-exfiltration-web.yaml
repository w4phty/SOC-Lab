title: Exfiltration - Web data transfer
id: 1f854909-8ff8-4200-b039-37327f6e4468
x_rule_id: SPL-25
status: experimental
description: |
  Detects abnormal amount of data being sent in a short amount of time. Based on 
  zeek_con fields dest_port, duration, orig_bytes.
references:
  - https://attack.mitre.org/techniques/T1567/
logsource:
  product: zeek
  service: conn
detection:
  selection:
    dest_port: 443
    duration|gte: 30
    orig_bytes|gte: 5000000
  condition: selection
falsepositives:
  - streaming, software updates
level: medium
tags:
  - attack.exfiltration
  - attack.t1567
