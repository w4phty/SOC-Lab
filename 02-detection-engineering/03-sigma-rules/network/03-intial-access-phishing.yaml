title: Initial Access - Executable file download
id: af7ff266-98a5-4ef3-a94c-b6502f7ea96a
x_rule_id: SPL-03
status: experimental
description: |
  Detects downloads of executable files. Based on suricata alert "Download EXE File".
  This helps detecting suspicious activity that could be involved in the initial access 
  phase, but is not directly phishing detection.
references:
  - https://attack.mitre.org/techniques/T1566/
logsource:
  product: monitoring
  service: suricata
detection:
  selection:
    alert_signature|contains: 'Download EXE File'
  condition: selection
falsepositives:
  - Legitimate software download or update
level: medium
tags:
  - attack.initial_access
  - attack.t1566
