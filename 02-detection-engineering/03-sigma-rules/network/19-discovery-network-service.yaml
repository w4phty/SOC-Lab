title: Discovery - Network service discovery
id: 423b4887-328e-439d-bbf4-263169a10ad5
x_rule_id: SPL-19
status: experimental
description: |
  Based on suricata alert "Possible TCP SYN Scan". This reuses the same alert as 
  SPL-01. Correlation with other logs will be necessary to determine the type of scanning
  used when this alert is raised.
references:
  - https://attack.mitre.org/techniques/T1046/
logsource:
  product: monitoring
  service: suricata
detection:
  selection:
    alert_signature|contains: 'Possible TCP SYN Scan'
  condition: selection
falsepositives:
  - Legitimate scans, monitoring purposes
level: medium
tags:
  - attack.discovery
  - attack.t1046
