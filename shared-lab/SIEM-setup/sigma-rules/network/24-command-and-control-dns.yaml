title: Command and Control - DNS Tunneling or C2
id: 6c7c1bcc-9c31-4fed-a9b2-bd2051de9633
x_rule_id: SPL-24
status: experimental
description: |
  Based on DNS Suricata alerts detecting: DGA domains, long subdomains, and base64
  tunneling.
references:
  - https://attack.mitre.org/techniques/T1071/004/
logsource:
  product: suricata
  category: ids
detection:
  selection:
    alert_signature|contains:
      - 'Possible DGA Domain'
      - 'Long subdomain'
      - 'Possible base64 tunneling'
  condition: selection
falsepositives:
  - cloud services using long subdomains
level: high
tags:
  - attack.command_and_control
  - attack.t1071.004
