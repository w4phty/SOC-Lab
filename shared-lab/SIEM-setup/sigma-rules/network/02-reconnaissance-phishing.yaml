title: Reconnaissance - Phishing for Information (NON COUVERT)
id: 8e1a1b60-1003-4a10-9a1f-000000000002
status: unsupported
description: |
  T1598 (Phishing for Information) vise la collecte d'informations par
  hameconnage cote victime, typiquement observable via des logs de
  passerelle mail (headers, pieces jointes, expediteur usurpe) ou un EDR de
  poste de travail avec visibilite navigateur/mail. Aucune de ces sources
  n'existe dans ce lab (pas de serveur mail, pas d'EDR). Cette technique est
  documentee ici comme un GAP DE VISIBILITE assume plutot que forcee avec une
  detection peu fiable. Amelioration possible : ajouter un serveur mail
  (ex. Zimbra/Postfix) avec logs forwardes pour couvrir ce cas.
references:
  - https://attack.mitre.org/techniques/T1598/
logsource:
