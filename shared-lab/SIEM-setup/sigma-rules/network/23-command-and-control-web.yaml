title: Command and Control - C2 web traffic
id: 2683bc20-d66f-4950-bc14-6a9c2839883b
x_rule_id: SPL-23
status: experimental
description: |
  Detects the exposure of cleartext credentials, which can be a sign of C2
  exfiltration not implemented properly, but also credential harvesting. Based on suricata
  alert "Cleartext Credentials".
references:
  - https://attack.mitre.org/techniques/T1071/001/
logsource:
  product: suricata
  category: ids
detection:
  selection:
    alert_signature|contains: 'Cleartext Credentials'
  condition: selection
falsepositives:
  - legitimate data sent over the network
level: high
tags:
  - attack.command_and_control
  - attack.t1071.001
