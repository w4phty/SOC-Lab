title: Discovery - Linux account enumeration
id: 96d0a298-2714-4842-95a5-db4b7eaaca78
x_rule_id: SPL-18
status: experimental
description: |
  Detects common enumeration method for local linux accounts. Based on auditd field command_line.
references:
  - https://attack.mitre.org/techniques/T1087/
logsource:
  product: linux
  service: auditd
detection:
  selection:
    command_line|contains:
      - '/etc/passwd'
      - '/etc/shadow'
      - 'getent passwd'
      - 'id -a'
      - 'w -h'
      - 'lastlog'
  condition: selection
falsepositives:
  - Legitimate system audit scripts
level: low
tags:
  - attack.discovery
  - attack.t1087
