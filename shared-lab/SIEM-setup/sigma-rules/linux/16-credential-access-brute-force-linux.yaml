title: Credential Access - Brute force SSH
id: 8e1a1b60-1002-4a10-9a1f-000000000006
status: experimental
description: |
  Detecte un nombre eleve d'echecs d'authentification SSH sur une courte
  fenetre de temps. LIMITATION : dans ce lab, src_ip et authentication status
  ne sont pas mappes pour le sourcetype sshd/linux_auth (colonnes vides dans
  le fichier de mapping) -> impossible de compter par IP source pour l'instant.
  Recommandation forte : extraire src_ip et method via une regle d'extraction
  Splunk (rex) sur le champ _raw ("Failed password ... from <ip> port <port>")
  et les ajouter au mapping pour un seuil precis par source. En attendant,
  cette regle compte les echecs par hostname/user via une recherche texte sur
  le message brut.
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: linux
  service: sshd
detection:
  selection:
    '|raw|contains': 'Failed password'
  timeframe: 5m
  condition: selection | count() by user > 10
falsepositives:
  - Utilisateur ayant oublie son mot de passe / script avec identifiants perimes
level: high
tags:
  - attack.credential_access
  - attack.t1110
