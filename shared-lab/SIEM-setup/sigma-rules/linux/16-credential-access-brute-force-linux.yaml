title: Credential Access - SSH Bruteforce 
id: e518646b-495a-457f-8fa9-1fbb5bf76f2c
x_rule_id: SPL-16
status: experimental
description: |
  Detects multiple failed SSH login attempts in a short amount of time. Based on sshd 
  field authentication_action.
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: linux
  service: sshd
detection:
  selection:
    authentication_action|contains: 'Failed password'
  timeframe: 5m
  condition: selection | count() by user > 10
falsepositives:
  - forgotten password, old credentials
level: high
tags:
  - attack.credential_access
  - attack.t1110
