title: Lateral Movement - outbound SSH Connection
id: f3404019-e217-4cc9-b19d-3fd5d6a5f817
x_rule_id: SPL-21
status: experimental
description: |
  Detects an established SSH connexion from one host to another on the internal network. 
  Based on sshd field authentication_action.
references:
  - https://attack.mitre.org/techniques/T1021/004/
logsource:
  product: linux
  service: sshd
detection:
  selection:
    authentication_action|contains: 'Accepted password'
  condition: selection
falsepositives:
  - Legitimate SSH connexion between hosts
level: low
tags:
  - attack.lateral_movement
  - attack.t1021.004
