title: Unix Shell - Reverse shell bash
id: 8e1a1b60-1002-4a10-9a1f-000000000001
status: experimental
description: |
  Detecte les patterns classiques de reverse shell bash. Combine deux sources :
  auditd (champs exe->executable, comm->comm, cmd->command_line) et la regle
  YARA existante "Linux_Reverse_Shell_Indicators" dont l'alerte est disponible
  via le champ alert (sourcetype yara Ubuntu).
references:
  - https://attack.mitre.org/techniques/T1059/004/
logsource:
  product: linux
  service: auditd
detection:
  selection:
    comm: 'bash'
    cmd|contains:
      - '/dev/tcp/'
      - 'bash -i'
      - '0>&1'
      - 'nc -e'
  condition: selection
falsepositives:
  - Scripts d'administration reseau legitimes utilisant /dev/tcp (rare)
level: critical
tags:
  - attack.execution
  - attack.t1059.004
