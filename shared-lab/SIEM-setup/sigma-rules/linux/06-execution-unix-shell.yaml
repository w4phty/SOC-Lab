title: Execution - Bash reverse shell
id: 7cfaca8b-c223-4348-ba7c-1166f1d36a03
x_rule_id: SPL-06
status: experimental
description: |
  Detects classic patterns of bash reverse shell. Based on auditd logs, 
  using fields command_line and process_name.
references:
  - https://attack.mitre.org/techniques/T1059/004/
logsource:
  product: linux
  service: auditd
detection:
  selection:
    process_name: 'bash'
    command_line|contains:
      - '/dev/tcp/'
      - 'bash -i'
      - '0>&1'
      - 'nc -e'
  condition: selection
falsepositives:
  - Legitimate admin script involving /dev/tcp
level: critical
tags:
  - attack.execution
  - attack.t1059.004
