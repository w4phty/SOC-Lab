title: Privilege Escalation - Sudo
id: 114948fc-10f8-4901-85f9-bf42c8ea189f
x_rule_id: SPL-14
status: experimental
description: |
  Detects suspicious sudo commands (shell spawn, such as GTFOBins binaries
  which use shell root escape), or exploiting sudo cache authentication. Based 
  on sudo fields command_line and user.
references:
  - https://attack.mitre.org/techniques/T1548/003/
logsource:
  product: linux
  service: sudo
detection:
  selection_shell_escape:
    command_line|contains:
      - '/bin/bash'
      - '/bin/sh'
      - 'chmod +s'
      - 'nc -e'
      - 'python3 -c'
      - 'vim -c'
      - 'less /etc/shadow'
  selection_all_sudo:
    command_line|exists: true
  timeframe: 5m
  condition: selection_shell_escape or selection_all_sudo | count() by user >= 5
falsepositives:
  - Admin system using legitimate root shell via sudo
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.003
