title: Lateral Movement - RDP connection
id: 06c6b62c-234b-4482-8f56-c2c60c7afefc
x_rule_id: SPL-20
status: experimental
description: |
  Detects new RDP session (EventID 4624). Based on Security fields event_code 
  and logon_type.
references:
  - https://attack.mitre.org/techniques/T1021/001/
logsource:
  product: windows
  service: security
detection:
  selection_event:
    event_code: 4624
  selection_type:
    logon_type: 10
  condition: selection_event and selection_type
falsepositives:
  - Any interactive legitimate connection
level: low
tags:
  - attack.lateral_movement
  - attack.t1021.001
