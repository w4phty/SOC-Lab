title: User Execution - Chaine de processus suspecte depuis une application utilisateur
id: 8e1a1b60-1001-4a10-9a1f-000000000003
status: experimental
description: |
  Detecte un processus enfant inhabituel (powershell, cmd, wscript, mshta) lance par
  une application utilisee pour ouvrir un lien/fichier/image malveillant (navigateur,
  client mail, lecteur PDF, Office). Correle idealement avec l'alerte Suricata
  "Download EXE File" (sid 1000002) survenue juste avant sur le meme hote.
  Champs Sysmon : parent_executable, executable, command_line, hostname.
references:
  - https://attack.mitre.org/techniques/T1204/
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\outlook.exe'
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\acrord32.exe'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Macro/complement legitime declenchant un script d'entreprise connu
level: high
tags:
  - attack.execution
  - attack.t1204
