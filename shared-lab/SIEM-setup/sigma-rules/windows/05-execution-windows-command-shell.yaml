title: Windows Command Shell - Enumeration ou chainage suspect
id: 8e1a1b60-1001-4a10-9a1f-000000000002
status: experimental
description: |
  Detecte cmd.exe lance avec des commandes d'enumeration ou de chainage typiques
  d'une main-en-clavier post-compromission (whoami, net user, systeminfo, tasklist,
  ou pipe vers findstr/more). Champs Sysmon : executable, parent_executable, command_line.
references:
  - https://attack.mitre.org/techniques/T1059/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\cmd.exe'
  selection_cmd:
    CommandLine|contains:
      - 'whoami /all'
      - 'net user /domain'
      - 'net group "domain admins"'
      - 'systeminfo'
      - 'tasklist /v'
      - '& echo'
      - '/c powershell'
  condition: selection_img and selection_cmd
falsepositives:
  - Scripts de collecte d'inventaire IT legitimes
level: medium
tags:
  - attack.execution
  - attack.t1059.003
