title: Persistence - Windows user account creation
id: a6abdb51-cbf2-49aa-a23d-bb0bc34a06eb
x_rule_id: SPL-12
status: experimental
description: |
  Detects the creation of a new user account (EventID 4720). Based on WinEventLog:Security
  field event_code.
references:
  - https://attack.mitre.org/techniques/T1136/
logsource:
  product: windows
  service: security
detection:
  selection:
    event_code: 4720
  condition: selection
falsepositives:
  - planned account creation
level: medium
tags:
  - attack.persistence
  - attack.t1136
