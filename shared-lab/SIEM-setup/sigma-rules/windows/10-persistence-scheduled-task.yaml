title: Persistence - Scheduled task creation
id: dfcaf5e0-0c1a-4d20-bae7-5adfd733faa1
x_rule_id: SPL-10
status: experimental
description: |
  Detects the creation of a new scheduled task. Based on Sysmon fields command_line
  and executable.
references:
  - https://attack.mitre.org/techniques/T1053/005/
logsource:
  product: windows
  category: process_creation
detection:
  selection_exe:
    executable|endswith: '\schtasks.exe'
  selection_cmd:
    command_line|contains: '/create'
  condition: selection_exe and selection_cmd
falsepositives:
  - Legitimate scheduled task for admin purposes
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
