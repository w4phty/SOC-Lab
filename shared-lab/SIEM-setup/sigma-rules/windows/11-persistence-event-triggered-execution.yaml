title: Persistence - Wmic or powershell subscription events
id: 716e00cd-8006-445f-abd2-2f0f9954684a
x_rule_id: SPL-11
status: experimental
description: |
  Detects usage of wmic or powershell for creating an event subscription, as a persistence
  technique. Based on Sysmon fields executable and command_line.
references:
  - https://attack.mitre.org/techniques/T1546/
logsource:
  product: windows
  category: process_creation
detection:
  selection_wmic:
    executable|endswith: '\wmic.exe'
    command_line|contains: 'eventsubscription'
  selection_ps:
    executable|endswith: '\powershell.exe'
    command_line|contains:
      - 'Register-WmiEvent'
      - '__EventFilter'
      - 'CommandLineEventConsumer'
  condition: selection_wmic or selection_ps
falsepositives:
  - legitimate supervision tools
level: medium
tags:
  - attack.persistence
  - attack.t1546
