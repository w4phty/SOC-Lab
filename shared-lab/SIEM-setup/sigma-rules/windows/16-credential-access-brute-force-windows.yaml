title: Credential Access - Brute force sur compte Windows
id: 8e1a1b60-1001-4a10-9a1f-000000000008
status: experimental
description: |
  Detecte un nombre eleve d'echecs d'authentification (EventID 4625) sur un
  meme hote en fenetre courte. Champs WinEventLog:Security : event_code,
  hostname. Le champ Account_Name n'etant pas mappe, le seuil est calcule par
  hostname ; ajouter account_name au mapping permettrait un seuil par compte
  cible, plus precis.
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 5m
  condition: selection | count() by hostname > 10
falsepositives:
  - Service ou script avec identifiants expires generant des echecs en boucle
level: high
tags:
  - attack.credential_access
  - attack.t1110
