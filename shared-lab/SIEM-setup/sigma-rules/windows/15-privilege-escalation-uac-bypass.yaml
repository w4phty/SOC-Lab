title: Privilege Escalation - UAC workaround via known LOLBins
id: cc1386dd-3dcd-401a-889f-b93dd34a77c7
x_rule_id: SPL-15
status: experimental
description: |
  Detects cmd or powershell launched with elevaiting token, bypassing User Account Control.
  This rule detects common UAC bypass child/parent processes. Based on Sysmon fields
  parent_executable and executable.
references:
  - https://attack.mitre.org/techniques/T1548/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    parent_executable|endswith:
      - '\fodhelper.exe'
      - '\eventvwr.exe'
      - '\computerdefaults.exe'
      - '\sdclt.exe'
  selection_child:
    executable|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
  condition: selection_parent and selection_child
falsepositives:
  - very few possibilities of false positives
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.002
