title: Privilege Escalation - Contournement UAC via LOLBins connus
id: 8e1a1b60-1001-4a10-9a1f-000000000007
status: experimental
description: |
  NOTE DE CORRECTION : dans le tableau MITRE fourni, la ligne "Privilege
  Escalation / Command and Scripting Interpreter - Windows Command Shell"
  reutilise par erreur le code T1053.005 (deja utilise pour la persistence).
  La technique reellement visee par ce cas d'usage (cmd/powershell lance avec
  un jeton eleve sans invite UAC) est T1548.002 - Bypass User Account Control.
  Cette regle detecte les chaines parent/enfant classiques de bypass UAC
  (fodhelper.exe, eventvwr.exe, computerdefaults.exe -> cmd/powershell).
  Champs Sysmon : parent_executable, executable, command_line.
references:
  - https://attack.mitre.org/techniques/T1548/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\fodhelper.exe'
      - '\eventvwr.exe'
      - '\computerdefaults.exe'
      - '\sdclt.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Tres rare en usage legitime, faux positifs improbables
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.002
