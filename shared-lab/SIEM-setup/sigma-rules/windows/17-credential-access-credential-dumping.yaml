title: Credential Access - Indicateurs de dump d'identifiants (Mimikatz)
id: 8e1a1b60-1001-4a10-9a1f-000000000009
status: experimental
description: |
  Combine deux sources : (1) la ligne de commande Sysmon d'un processus qui
  accede a LSASS ou invoque des modules Mimikatz connus, et (2) l'alerte YARA
  existante "Mimikatz_Indicators" (declenchee sur le contenu memoire/disque).
  Champs Sysmon : executable, command_line. Champs YARA Windows : alert
  (message), hostname.
references:
  - https://attack.mitre.org/techniques/T1003/
logsource:
  product: windows
  category: process_creation
detection:
  selection_cmd:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'lsadump::sam'
      - 'privilege::debug'
      - 'kerberos::list'
  selection_lsass:
    CommandLine|contains: 'procdump'
    CommandLine|contains|all:
      - 'lsass'
  condition: selection_cmd or selection_lsass
falsepositives:
  - Outils EDR/forensics legitimes manipulant LSASS (procdump officiel Sysinternals)
level: critical
tags:
  - attack.credential_access
  - attack.t1003
