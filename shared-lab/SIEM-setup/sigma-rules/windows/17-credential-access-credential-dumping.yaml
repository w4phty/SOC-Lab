title: Credential Access - credentials dumping
id: 3207e611-4d94-4850-9aba-e43c33534171
x_rule_id: SPL-17
status: experimental
description: |
  Detects commands accessing lsassor running Mimikatz common modules. Based on
  Sysmon field command_line.
references:
  - https://attack.mitre.org/techniques/T1003/
logsource:
  product: windows
  category: process_creation
detection:
  selection_cmd:
    command_line|contains:
      - 'sekurlsa::logonpasswords'
      - 'lsadump::sam'
      - 'privilege::debug'
      - 'kerberos::list'
  selection_lsass:
    command_line|contains: 'procdump'
    command_line|contains|all:
      - 'lsass'
  condition: selection_cmd or selection_lsass
falsepositives:
  - Legitimate use of LSASS (LSASS inspection by antivirus or EDR)
level: critical
tags:
  - attack.credential_access
  - attack.t1003
